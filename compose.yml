services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
    volumes:
      - ./packages/backend/data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    ports:
      - "4173:4173"
    environment:
      NODE_ENV: production
      PORT: "4173"
      HOST: "0.0.0.0"
      BACKEND_URL: "http://backend:3000"
    depends_on:
      - backend
    restart: unless-stopped
